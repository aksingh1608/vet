[project]
name = "vet"
version = "0.1.0"
description = "Vendor due-diligence agent: checks a software vendor's claims against independent evidence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.4",
    "rich>=13.7",
    "trafilatura>=1.12",
    "typer>=0.12",
]

[project.scripts]
vet = "vet.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Ignore pytest plugins leaked in through a system PYTHONPATH (e.g. ROS).
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_ros",
    "-p", "no:ament_copyright",
    "-p", "no:ament_flake8",
    "-p", "no:ament_lint",
    "-p", "no:ament_pep257",
    "-p", "no:ament_xmllint",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # never reformat code blocks in docs/spec

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "DTZ", "T20", "G", "RET", "SIM"]
